<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoloSync - Plano de Ações</title>
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A2463">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoloSync">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171B26; --panel:#1F2433; --panel-alt:#262C3F; --border:#333B52;
    --text:#ECE9E1; --text-muted:#9098AF;
    --gold:#D6A756; --teal:#4FA98C; --red:#C1666B; --blue:#6C8EBF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  #config-warning{background:rgba(193,102,107,0.12);border:1px solid var(--red);color:var(--red);padding:14px;border-radius:10px;font-size:12.5px;max-width:420px;margin:20px auto;text-align:center;}

  .topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .topbar h1{font-size:20px;}
  #btn-back{background:none;border:1px solid var(--border);color:var(--text-muted);padding:7px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .spacer{flex:1;}
  #select-polo{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;}
  .small-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;}
  .btn-primary{background:var(--gold);color:#1B1B14;border:none;padding:9px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-secondary{background:none;border:1px solid var(--border);color:var(--text-muted);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;}
  .btn-danger{background:none;border:none;color:var(--red);font-size:12.5px;cursor:pointer;text-decoration:underline;}

  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px;flex-wrap:wrap;}
  .tabs button{background:none;border:none;color:var(--text-muted);padding:7px 12px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;}
  .tabs button.active{background:var(--panel-alt);color:var(--text);}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:20px 28px;}
  .metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .metric .value{font-family:'Fraunces',serif;font-size:26px;font-weight:500;}
  .metric .label{color:var(--text-muted);font-size:12.5px;margin-top:4px;}
  .metric.warn .value{color:var(--red);}

  .frentes-box{padding:0 28px 20px 28px;display:flex;gap:14px;flex-wrap:wrap;}
  .frente-card{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .frente-card .fc-nome{font-size:12.5px;font-weight:600;margin-bottom:6px;}
  .frente-card .fc-bar{height:6px;background:var(--panel-alt);border-radius:4px;overflow:hidden;margin-top:6px;}
  .frente-card .fc-fill{height:100%;background:var(--teal);}
  .frente-card .fc-info{font-size:11px;color:var(--text-muted);margin-top:4px;}

  .pa-table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--panel);border:1px solid var(--border);}
  .pa-table th{background:#1F2F57;color:#fff;padding:8px 10px;text-align:center;font-weight:600;white-space:nowrap;}
  .pa-table td{padding:6px 10px;text-align:center;border-top:1px solid var(--border);}
  .pa-table td:first-child,.pa-table th:first-child{text-align:left;}
  .pa-table tr.pa-total td{background:#1F2F57;color:#fff;font-weight:700;}
  .pa-table td.pa-warn{color:var(--red);font-weight:600;}
  .pa-wrap{overflow-x:auto;margin-bottom:18px;}
  .list-area{padding:0 28px 28px 28px;display:flex;flex-direction:column;gap:10px;}
  .acao-row{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;}
  .acao-row:hover{border-color:var(--gold);}
  .acao-row.status-concluida{border-left-color:var(--teal);}
  .acao-row.status-atrasada{border-left-color:var(--red);}
  .acao-row.status-cancelada{border-left-color:var(--text-muted); opacity:0.65;}
  .acao-row .ar-main{flex:1;min-width:200px;}
  .acao-row .ar-titulo{font-size:13.5px;font-weight:600;}
  .acao-row .ar-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
  .status-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;background:var(--panel-alt);color:var(--text-muted);}
  .status-badge.status-concluida{color:var(--teal);}
  .status-badge.status-atrasada{color:var(--red);}
  .status-badge.status-cancelada{color:var(--text-muted);}
  .status-badge.status-em-andamento{color:var(--gold);}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,12,18,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay[hidden]{display:none;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:460px;padding:26px;max-height:88vh;overflow-y:auto;}
  .modal h2{font-size:19px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;font-family:'Inter';font-size:13.5px;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  #loading-screen{padding:60px;text-align:center;color:var(--text-muted);}
  .sync-fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1B1B14;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:200;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .sync-fab:hover{transform:scale(1.06);}
  .sync-fab.listening{background:var(--red);animation:sync-pulse 1s infinite;}
  .sync-fab.speaking{background:var(--teal);animation:sync-pulse 1.4s infinite;}
  @keyframes sync-pulse{0%{box-shadow:0 0 0 0 rgba(193,102,107,0.5);}70%{box-shadow:0 0 0 16px rgba(193,102,107,0);}100%{box-shadow:0 0 0 0 rgba(193,102,107,0);}}
  .sync-bubble{position:fixed;bottom:92px;right:24px;max-width:260px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:200;}
  .sync-bubble[hidden]{display:none;}
</style>
<link rel="stylesheet" href="tema.css">
</head>
<body>

<div id="config-warning" style="display:none;">
  ⚠️ Configuração pendente: cole o mesmo firebaseConfig usado no index.html na seção CONFIGURAÇÃO deste arquivo.
</div>

<div id="loading-screen">Carregando...</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <button id="btn-back">← Voltar</button>
    <h1>Plano de Ações</h1>
    <div class="spacer"></div>
    <label style="font-size:11.5px;color:var(--text-muted);">POLO</label>
    <select id="select-polo"></select>
  </div>

  <div class="topbar">
    <div class="tabs" id="tabs-frente">
      <button data-filter="todos" class="active">Todas as frentes</button>
      <button data-filter="Captação de novos alunos">Captação</button>
      <button data-filter="Rematrícula e retenção">Rematrícula</button>
      <button data-filter="Relacionamento com igrejas e escolas">Igrejas/escolas</button>
      <button data-filter="Rotina de gestão e acompanhamento do polo">Rotina de gestão</button>
    </div>
    <div class="tabs" id="tabs-status">
      <button data-filter="todos" class="active">Todos status</button>
      <button data-filter="Não iniciada">Não iniciada</button>
      <button data-filter="Em andamento">Em andamento</button>
      <button data-filter="Concluída">Concluída</button>
      <button data-filter="Atrasada">Atrasada</button>
      <button data-filter="Cancelada">Cancelada</button>
    </div>
    <div class="spacer"></div>
    <button class="btn-primary" id="btn-new-acao">+ Nova ação</button>
  </div>

  <div id="entregas-box" style="padding:20px 28px 0 28px;"></div>
  <div class="metrics" id="plano-metrics"></div>
  <div class="frentes-box" id="frentes-box"></div>
  <div id="painel-acomp" style="padding:0 28px 20px 28px;"></div>
  <div class="list-area" id="acoes-list"></div>
</div>

<div class="modal-overlay" id="modal-rel" hidden>
  <div class="modal" style="max-width:640px;">
    <h2 id="rel-titulo">Relatório</h2>
    <p id="rel-sub" style="color:var(--text-muted);font-size:13px;margin:4px 0 12px;"></p>
    <div id="rel-campos"></div>
    <div id="rel-previa-box" hidden>
      <label style="font-weight:600;font-size:13px;">Relatório pronto (você pode editar o texto):</label>
      <textarea id="rel-texto" rows="14" style="width:100%;margin-top:6px;"></textarea>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
      <button type="button" class="btn-primary" id="rel-gerar">✨ Montar relatório</button>
      <button type="button" class="small-btn" id="rel-copiar" hidden>📋 Copiar</button>
      <button type="button" class="small-btn" id="rel-baixar" hidden>⬇ Baixar (Word)</button>
      <button type="button" class="small-btn" id="rel-salvar" hidden>💾 Salvar no app</button>
      <button type="button" class="small-btn" id="rel-fechar">Fechar</button>
    </div>
    <div id="rel-status" style="font-size:12.5px;color:var(--text-muted);margin-top:8px;"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-acao" hidden>
  <div class="modal">
    <h2 id="acao-modal-title">Nova ação</h2>
    <form id="acao-form">
      <div class="field"><label>Frente de atuação</label>
        <select id="p-frente">
          <option>Captação de novos alunos</option>
          <option>Rematrícula e retenção</option>
          <option>Relacionamento com igrejas e escolas</option>
          <option>Rotina de gestão e acompanhamento do polo</option>
        </select>
      </div>
      <div class="field"><label>Ação</label><input type="text" id="p-acao" required placeholder="Ex: Visitar 3 igrejas do distrito"></div>
      <div class="field-row">
        <div class="field"><label>Responsável</label><input type="text" id="p-responsavel"></div>
        <div class="field"><label>Prazo</label><input type="date" id="p-prazo"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Indicador</label><input type="text" id="p-indicador" placeholder="Ex: nº de visitas"></div>
        <div class="field"><label>Meta</label><input type="number" id="p-meta" step="0.01"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Resultado</label><input type="number" id="p-resultado" step="0.01"></div>
        <div class="field"><label>Status</label>
          <select id="p-status">
            <option>Não iniciada</option><option>Em andamento</option><option>Concluída</option>
            <option>Atrasada</option><option>Cancelada</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Observações</label><textarea id="p-observacoes"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="btn-delete-acao" hidden>Excluir</button>
        <div style="flex:1"></div>
        <button type="button" class="btn-secondary" id="btn-cancel-acao">Cancelar</button>
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<button class="sync-fab" id="sync-btn" title="Comando de voz Sync" hidden>🎙️</button>
<div class="sync-bubble" id="sync-bubble" hidden></div>

<script src="assistant.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { verificarAcesso, mostrarTelaBloqueio } from "./acesso.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDocs, getDoc, setDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ============ CONFIGURAÇÃO ============ */
// Cole aqui o MESMO firebaseConfig usado no index.html
const firebaseConfig = {
  apiKey: "AIzaSyASApoPVmsNyTmcNSrxlTZ5yU7WGN7lR3o",
  authDomain: "gestor-ead.firebaseapp.com",
  projectId: "gestor-ead",
  storageBucket: "gestor-ead.firebasestorage.app",
  messagingSenderId: "690843825301",
  appId: "1:690843825301:web:0c389349ba9eed8582179c",
};
if(firebaseConfig.apiKey === "COLE_AQUI"){
  document.getElementById('config-warning').style.display = 'block';
}

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const FRENTES = [
  'Captação de novos alunos','Rematrícula e retenção',
  'Relacionamento com igrejas e escolas','Rotina de gestão e acompanhamento do polo',
];

let currentUser = null;
let polos = [];
let selectedPoloId = null;
let planoAcoes = [];
let editingAcaoId = null;
let filtroFrente = 'todos';
let filtroStatus = 'todos';

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function statusClass(status){ return 'status-' + (status||'').toLowerCase().replace(/[^a-z]+/g,'-').replace(/^-|-$/g,''); }
function formatDateBR(dateStr){ if(!dateStr) return ''; const [y,m,d]=dateStr.split('-'); return `${d}/${m}/${y}`; }

document.getElementById('btn-back').addEventListener('click', () => window.location.href = 'index.html');

onAuthStateChanged(auth, async (user) => {
  if(!user){ window.location.href = 'index.html'; return; }
  currentUser = user;
  const acesso = await verificarAcesso(db, user);
  if(!acesso.liberado){
    document.getElementById('loading-screen').style.display = 'none';
    mostrarTelaBloqueio(acesso, user, () => { window.location.href = 'index.html'; });
    return;
  }
  try{
    await loadPolos();
    renderPoloSelect();
    await loadPlanoAcoes();
    render();
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('sync-btn').hidden = false;
  }catch(err){
    console.error(err);
    document.getElementById('loading-screen').innerHTML =
      `Erro ao carregar: ${err.message}<br><br>Se aparecer "permission-denied", as regras do Firestore provavelmente não foram publicadas.`;
  }
});

async function loadPolos(){
  const q = query(collection(db, 'polos'), where('gestores', 'array-contains', currentUser.uid));
  const snap = await getDocs(q);
  polos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const saved = localStorage.getItem('polo-selecionado');
  selectedPoloId = polos.find(p => p.id === saved) ? saved : (polos[0] ? polos[0].id : null);
}
function renderPoloSelect(){
  document.getElementById('select-polo').innerHTML = polos.map(p =>
    `<option value="${p.id}" ${p.id===selectedPoloId?'selected':''}>${escapeHtml(p.nome)}</option>`).join('');
}
document.getElementById('select-polo').addEventListener('change', async e => {
  selectedPoloId = e.target.value;
  localStorage.setItem('polo-selecionado', selectedPoloId);
  await loadPlanoAcoes();
  render();
});

async function loadPlanoAcoes(){
  await loadEntregas();
  await loadRelatoriosEntregas();
  if(!selectedPoloId){ planoAcoes = []; return; }
  const snap = await getDocs(collection(db, 'polos', selectedPoloId, 'planoAcoes'));
  planoAcoes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (a.prazo || '').localeCompare(b.prazo || ''));
}

function getFiltered(){
  return planoAcoes.filter(a => {
    if(filtroFrente !== 'todos' && a.frente !== filtroFrente) return false;
    if(filtroStatus !== 'todos' && a.status !== filtroStatus) return false;
    return true;
  });
}

let cicoAno = null;
const MESES_CICLO = ['Novembro','Dezembro','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro (ano 2)'];
function anoInicioCiclo(dataStr){ const [y,m] = dataStr.split('-').map(Number); return m >= 11 ? y : y - 1; }
function renderPainelAcompanhamento(){
  const box = document.getElementById('painel-acomp'); if(!box) return;
  const hoje = new Date();
  const anos = new Set([anoInicioCiclo(`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-01`)]);
  planoAcoes.forEach(a => { if(a.prazo) anos.add(anoInicioCiclo(a.prazo)); });
  const lista = [...anos].sort();
  if(cicoAno === null || !anos.has(cicoAno)) cicoAno = lista[lista.length-1];
  const contar = itens => ({
    total: itens.length,
    nao: itens.filter(a => a.status === 'Não iniciada').length,
    and: itens.filter(a => a.status === 'Em andamento').length,
    conc: itens.filter(a => a.status === 'Concluída').length,
    atr: itens.filter(a => a.status === 'Atrasada').length,
    canc: itens.filter(a => a.status === 'Cancelada').length,
  });
  const pct = c => c.total ? ((c.conc / c.total) * 100).toFixed(1).replace('.', ',') + '%' : '0,0%';
  const linhas = MESES_CICLO.map((nome, k) => {
    const mes = ((10 + k) % 12) + 1, ano = cicoAno + (10 + k >= 12 ? 1 : 0);
    const chave = `${ano}-${String(mes).padStart(2,'0')}`;
    return { nome, c: contar(planoAcoes.filter(a => a.prazo && a.prazo.slice(0,7) === chave)) };
  });
  const semPrazo = contar(planoAcoes.filter(a => !a.prazo));
  const tot = contar(planoAcoes.filter(a => !a.prazo || anoInicioCiclo(a.prazo) === cicoAno));
  const tr = (nome, c, extra) => `<tr class="${extra||''}"><td>${nome}</td><td>${c.total}</td><td>${c.nao}</td><td>${c.and}</td><td>${c.conc}</td><td class="${c.atr?'pa-warn':''}">${c.atr}</td><td>${c.canc}</td><td>${pct(c)}</td></tr>`;
  box.innerHTML = `
    <details open>
      <summary style="cursor:pointer;font-family:'Fraunces',serif;font-size:16px;margin-bottom:10px;">📊 Painel de acompanhamento</summary>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--text-muted);">Ciclo:</span>
        <select id="pa-ciclo" style="background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12.5px;">
          ${lista.map(y => `<option value="${y}" ${y===cicoAno?'selected':''}>Nov/${y} → Nov/${y+1}</option>`).join('')}
        </select>
        <span style="font-size:11.5px;color:var(--text-muted);">Calculado automaticamente pelo prazo e status de cada ação.</span>
      </div>
      <div class="pa-wrap"><table class="pa-table">
        <tr><th>Mês</th><th>Ações planejadas</th><th>Não iniciadas</th><th>Em andamento</th><th>Concluídas</th><th>Atrasadas</th><th>Canceladas</th><th>% concluído</th></tr>
        ${linhas.map(l => tr(l.nome, l.c)).join('')}
        ${semPrazo.total ? tr('Sem prazo definido', semPrazo) : ''}
        ${tr('TOTAL DO CICLO', tot, 'pa-total')}
      </table></div>
      <h3 style="font-size:14px;margin:6px 0 8px;">Por frente de atuação</h3>
      <div class="pa-wrap"><table class="pa-table" style="max-width:640px;">
        <tr><th>Frente</th><th>Ações planejadas</th><th>Concluídas</th><th>Atrasadas</th><th>% concluído</th></tr>
        ${FRENTES.map(f => { const c = contar(planoAcoes.filter(a => a.frente === f && (!a.prazo || anoInicioCiclo(a.prazo) === cicoAno))); return `<tr><td>${escapeHtml(f)}</td><td>${c.total}</td><td>${c.conc}</td><td class="${c.atr?'pa-warn':''}">${c.atr}</td><td>${pct(c)}</td></tr>`; }).join('')}
      </table></div>
    </details>`;
  document.getElementById('pa-ciclo').addEventListener('change', e => { cicoAno = Number(e.target.value); renderPainelAcompanhamento(); });
}


/* ============ ENTREGAS DE CADA MÓDULO ============ */
const ENTREGAS = [
  {t:'Iniciativa de Inovação', d:'Proposta de uma ação de melhoria no polo.'},

let relatoriosSalvos = {};
let relAtual = null; // {chave, modelo}
async function loadRelatoriosEntregas(){
  relatoriosSalvos = {};
  if(!selectedPoloId) return;
  try{ const sn = await getDoc(doc(db,'polos',selectedPoloId,'entregas','relatorios')); if(sn.exists()) relatoriosSalvos = sn.data(); }catch(e){ console.warn(e); }
}
function poloAtualNome(){ const p = polos.find(x=>x.id===selectedPoloId); return p ? p.nome : ''; }
function montarTexto(m, modelo, vals){
  const hoje = new Date().toLocaleDateString('pt-BR');
  let t = `RELATÓRIO — ${modelo.titulo.toUpperCase()}\nPolo: ${poloAtualNome()}\nMódulo ${m}  |  Data: ${hoje}\nGestor(a): ${currentUser && currentUser.email ? currentUser.email : ''}\n`;
  modelo.campos.forEach((c,i)=>{
    const v = (vals[c.id]||'').trim();
    t += `\n${i+1}. ${c.label}\n`;
    if(!v){ t += '   [a preencher]\n'; return; }
    const linhas = v.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    t += linhas.length>1 ? linhas.map(l=>'   • '+l.replace(/^[-•*]\s*/,'')).join('\n')+'\n' : '   '+linhas[0]+'\n';
  });
  return t;
}
function abrirRelatorio(chave, mod){
  const modelo = MODELOS[mod]; if(!modelo) return;
  relAtual = {chave, mod, modelo};
  const salvo = relatoriosSalvos[chave] || {};
  document.getElementById('rel-titulo').textContent = '✍️ ' + modelo.titulo;
  document.getElementById('rel-sub').textContent = 'Escreva com suas palavras, em tópicos ou frases curtas. Depois clique em "Montar relatório".';
  document.getElementById('rel-campos').innerHTML = modelo.campos.map(c=>`
    <div class="field" style="margin-bottom:10px;"><label>${escapeHtml(c.label)}</label>
      <textarea data-c="${c.id}" rows="3" placeholder="${escapeHtml(c.dica)}" style="width:100%;">${escapeHtml((salvo.campos||{})[c.id]||'')}</textarea></div>`).join('');
  const temTexto = !!salvo.texto;
  document.getElementById('rel-texto').value = salvo.texto || '';
  document.getElementById('rel-previa-box').hidden = !temTexto;
  ['rel-copiar','rel-baixar','rel-salvar'].forEach(id=>document.getElementById(id).hidden = !temTexto);
  document.getElementById('rel-status').textContent = salvo.atualizado ? 'Salvo em ' + new Date(salvo.atualizado).toLocaleString('pt-BR') : '';
  document.getElementById('modal-rel').hidden = false;
}
function valoresRel(){ const v={}; document.querySelectorAll('#rel-campos textarea').forEach(t=>v[t.dataset.c]=t.value); return v; }
document.getElementById('rel-gerar').addEventListener('click', ()=>{
  if(!relAtual) return;
  const m = relAtual.chave.match(/^m(\d+)_/)[1];
  document.getElementById('rel-texto').value = montarTexto(m, relAtual.modelo, valoresRel());
  document.getElementById('rel-previa-box').hidden = false;
  ['rel-copiar','rel-baixar','rel-salvar'].forEach(id=>document.getElementById(id).hidden = false);
  document.getElementById('rel-status').textContent = 'Relatório montado. Revise, copie, baixe ou salve.';
});
document.getElementById('rel-copiar').addEventListener('click', async ()=>{
  const t = document.getElementById('rel-texto').value;
  try{ await navigator.clipboard.writeText(t); document.getElementById('rel-status').textContent='Copiado! Agora é só colar onde precisar.'; }
  catch(e){ document.getElementById('rel-texto').select(); document.execCommand('copy'); document.getElementById('rel-status').textContent='Copiado!'; }
});
document.getElementById('rel-baixar').addEventListener('click', ()=>{
  const t = document.getElementById('rel-texto').value;
  const html = '<html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial;font-size:12pt;">' +
    escapeHtml(t).replace(/\n/g,'<br>').replace(/ {3}/g,'&nbsp;&nbsp;&nbsp;') + '</body></html>';
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'Relatorio-' + relAtual.modelo.titulo.replace(/[^\wÀ-ú]+/g,'-') + '.doc'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
});
document.getElementById('rel-salvar').addEventListener('click', async ()=>{
  if(!relAtual || !selectedPoloId) return;
  const reg = { campos: valoresRel(), texto: document.getElementById('rel-texto').value, atualizado: Date.now() };
  try{
    await setDoc(doc(db,'polos',selectedPoloId,'entregas','relatorios'), {[relAtual.chave]: reg}, {merge:true});
    relatoriosSalvos[relAtual.chave] = reg;
    document.getElementById('rel-status').textContent = '✅ Salvo no app.';
    renderEntregas();
  }catch(err){ document.getElementById('rel-status').textContent = 'Não consegui salvar: ' + err.message; }
});
document.getElementById('rel-fechar').addEventListener('click', ()=>document.getElementById('modal-rel').hidden = true);

let entregasDados = {};
let moduloSel = Number(localStorage.getItem('modulo-entregas') || 1);

  try{ const s = await getDoc(doc(db,'polos',selectedPoloId,'entregas','modulos')); if(s.exists()) entregasDados = s.data(); }catch(e){ console.warn(e); }

   <div class="ent-card">
     <div class="ent-head">
       <div><span class="ent-tag">ENTREGAS</span><h3>Suas entregas em cada módulo</h3></div>
       <select id="ent-modulo">${opts}</select>
     </div>
     <div class="ent-grid">
     ${ENTREGAS.map((e,i)=>{ const k=`m${m}_e${i+1}`; return `
       <label class="ent-item ${entregasDados[k]?'ok':''}">
         <input type="checkbox" data-k="${k}" ${entregasDados[k]?'checked':''}>
         <span class="ent-n">${i+1}</span>
         <span><b>${e.t}</b><small>${e.d}</small>
           <button type="button" class="ent-rel" data-rel="m${m}_e${i+1}" data-mod="e${i+1}">${relatoriosSalvos[`m${m}_e${i+1}`]?'📄 Abrir relatório':'✍️ Fazer relatório'}</button></span>
       </label>`; }).join('')}
     </div>
     <div class="ent-foot">📌 Entregas: início e fim de cada módulo · <b>${feitas}/${ENTREGAS.length}</b> concluídas no Módulo ${m}</div>
   </div>
   <div class="ent-card ent-light" style="margin-top:14px;">
     <div class="ent-head">
       <div><span class="ent-tag">EAD ADVENTISTA · POLOS</span><h3>Planejamento de Marketing</h3>
       <small class="ent-sub">O que o documento de cada polo deverá apresentar no módulo. ${MARKETING.length} frentes de trabalho, com evidências e resultados.</small></div>
     </div>
     <div class="ent-grid ent-col1">
     ${MARKETING.map((e,i)=>{ const k=`m${m}_mkt${i+1}`; return `
       <label class="ent-item ${entregasDados[k]?'ok':''}">
         <input type="checkbox" data-k="${k}" ${entregasDados[k]?'checked':''}>
         <span class="ent-n">${String(i+1).padStart(2,'0')}</span>
         <span><b>${e.t}</b><small>${e.d}</small>
           <button type="button" class="ent-rel" data-rel="m${m}_mkt${i+1}" data-mod="mkt${i+1}">${relatoriosSalvos[`m${m}_mkt${i+1}`]?'📄 Abrir relatório':'✍️ Fazer relatório'}</button></span>
       </label>`; }).join('')}
     </div>
     <div class="ent-foot">📣 Supervisão de Marketing · <b>${MARKETING.filter((_,i)=>entregasDados[`m${m}_mkt${i+1}`]).length}/${MARKETING.length}</b> frentes prontas no Módulo ${m}</div>
   </div>`;
  document.getElementById('ent-modulo').addEventListener('change', e=>{ moduloSel=Number(e.target.value); localStorage.setItem('modulo-entregas',moduloSel); renderEntregas(); });
  box.querySelectorAll('.ent-rel').forEach(btn=>btn.addEventListener('click', ev=>{ ev.preventDefault(); ev.stopPropagation(); abrirRelatorio(btn.dataset.rel, btn.dataset.mod); }));
  box.querySelectorAll('input[data-k]').forEach(cb=>cb.addEventListener('change', async ()=>{
    const k=cb.dataset.k; entregasDados[k]=cb.checked; renderEntregas();
    try{ await setDoc(doc(db,'polos',selectedPoloId,'entregas','modulos'), {[k]:cb.checked}, {merge:true}); }
    catch(err){ alert('Não consegui salvar: '+err.message); entregasDados[k]=!cb.checked; renderEntregas(); }
  }));

function render(){
  const all = getFiltered();
  renderPainelAcompanhamento();
  renderEntregas();
  const total = all.length;
  const concluidas = all.filter(a => a.status === 'Concluída').length;
  const atrasadas = all.filter(a => a.status === 'Atrasada').length;
  const pct = total > 0 ? Math.round((concluidas/total)*100) : 0;
  document.getElementById('plano-metrics').innerHTML = `
    <div class="metric"><div class="value">${total}</div><div class="label">Ações no filtro atual</div></div>
    <div class="metric"><div class="value">${concluidas}</div><div class="label">Concluídas</div></div>
    <div class="metric ${atrasadas>0?'warn':''}"><div class="value">${atrasadas}</div><div class="label">Atrasadas</div></div>
    <div class="metric"><div class="value">${pct}%</div><div class="label">% concluído</div></div>
  `;

  document.getElementById('frentes-box').innerHTML = FRENTES.map(frente => {
    const itens = planoAcoes.filter(a => a.frente === frente);
    const conc = itens.filter(a => a.status === 'Concluída').length;
    const p = itens.length > 0 ? Math.round((conc/itens.length)*100) : 0;
    return `<div class="frente-card">
      <div class="fc-nome">${escapeHtml(frente)}</div>
      <div class="fc-info">${conc}/${itens.length} concluídas</div>
      <div class="fc-bar"><div class="fc-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join('');

  const list = document.getElementById('acoes-list');
  if(all.length === 0){
    list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Nenhuma ação neste filtro.</div>';
    return;
  }
  list.innerHTML = all.map(a => `
    <div class="acao-row ${statusClass(a.status)}" data-id="${a.id}">
      <div class="ar-main">
        <div class="ar-titulo">${escapeHtml(a.acao)}</div>
        <div class="ar-meta">${escapeHtml(a.frente)} ${a.responsavel ? '· ' + escapeHtml(a.responsavel) : ''} ${a.prazo ? '· prazo ' + formatDateBR(a.prazo) : ''} ${a.indicador ? '· ' + escapeHtml(a.indicador) + (a.meta!=null?': '+a.resultado+'/'+a.meta:'') : ''}</div>
        ${a.evidencia ? `<div style="font-size:10.5px;color:var(--teal);margin-top:4px;">📷 Registrada no relatório de ${MES_NOMES[a.evidencia.mes]}/${a.evidencia.ano}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${a.evidencia ? `<button type="button" class="small-btn" data-ver-relatorio="${a.evidencia.mes}-${a.evidencia.ano}">Ver relatório</button>` : ''}
        <span class="status-badge ${statusClass(a.status)}">${escapeHtml(a.status||'Não iniciada')}</span>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.acao-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.dataset.verRelatorio) return;
      openAcaoModal(row.dataset.id);
    });
  });
  list.querySelectorAll('[data-ver-relatorio]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      localStorage.setItem('relatorio-abrir-mes-ano', btn.dataset.verRelatorio);
      window.location.href = 'relatorios.html';
    });
  });
}

document.getElementById('tabs-frente').addEventListener('click', e => {

document.getElementById('tabs-status').addEventListener('click', e => {
  if(e.target.tagName !== 'BUTTON') return;

function openAcaoModal(id=null){
  editingAcaoId = id;
  document.getElementById('acao-form').reset();
  const btnDel = document.getElementById('btn-delete-acao');
  if(id){
    const a = planoAcoes.find(x => x.id === id);
    document.getElementById('acao-modal-title').textContent = 'Editar ação';
    document.getElementById('p-frente').value = a.frente;
    document.getElementById('p-acao').value = a.acao;
    document.getElementById('p-responsavel').value = a.responsavel || '';
    document.getElementById('p-prazo').value = a.prazo || '';
    document.getElementById('p-indicador').value = a.indicador || '';
    document.getElementById('p-meta').value = a.meta ?? '';
    document.getElementById('p-resultado').value = a.resultado ?? '';
    document.getElementById('p-status').value = a.status || 'Não iniciada';
    document.getElementById('p-observacoes').value = a.observacoes || '';
    btnDel.hidden = false;
  } else {
    document.getElementById('acao-modal-title').textContent = 'Nova ação';
    document.getElementById('p-status').value = 'Não iniciada';
    btnDel.hidden = true;
  }
  document.getElementById('modal-acao').hidden = false;
}
document.getElementById('btn-new-acao').addEventListener('click', () => openAcaoModal());
document.getElementById('btn-cancel-acao').addEventListener('click', () => document.getElementById('modal-acao').hidden = true);

document.getElementById('acao-form').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {
    frente: document.getElementById('p-frente').value,
    acao: document.getElementById('p-acao').value.trim(),
    responsavel: document.getElementById('p-responsavel').value.trim(),
    prazo: document.getElementById('p-prazo').value || null,
    indicador: document.getElementById('p-indicador').value.trim(),
    meta: document.getElementById('p-meta').value !== '' ? Number(document.getElementById('p-meta').value) : null,
    resultado: document.getElementById('p-resultado').value !== '' ? Number(document.getElementById('p-resultado').value) : null,
    status: document.getElementById('p-status').value,
    observacoes: document.getElementById('p-observacoes').value.trim(),
  };
  if(!data.acao) return;
  if(editingAcaoId){
    await updateDoc(doc(db, 'polos', selectedPoloId, 'planoAcoes', editingAcaoId), data);
  } else {
    data.criadoEm = new Date().toISOString();
    await addDoc(collection(db, 'polos', selectedPoloId, 'planoAcoes'), data);
  }
  document.getElementById('modal-acao').hidden = true;
  await loadPlanoAcoes();
  render();
});
document.getElementById('btn-delete-acao').addEventListener('click', async () => {
  if(!editingAcaoId || !confirm('Excluir esta ação do plano?')) return;
  await deleteDoc(doc(db, 'polos', selectedPoloId, 'planoAcoes', editingAcaoId));
  document.getElementById('modal-acao').hidden = true;
  await loadPlanoAcoes();
  render();
});

/* ================= SYNC — assistente de voz ================= */
function syncSay(texto){
  const bubble = document.getElementById('sync-bubble');
  bubble.textContent = texto;
  bubble.hidden = false;
  SyncAssistant.speak(texto);
  clearTimeout(window.__syncBubbleTimeout);
  window.__syncBubbleTimeout = setTimeout(() => { bubble.hidden = true; }, 7000);
}
SyncAssistant.init((texto) => {
  const bubble = document.getElementById('sync-bubble');
  bubble.textContent = `Ouvi: "${texto}"`;
  bubble.hidden = false;
  const intent = SyncParse.intent(texto);
  setTimeout(() => handleSyncIntent(intent, texto), 400);
});
document.getElementById('sync-btn').addEventListener('click', () => {
  if(!SyncAssistant.supported){
    const bubble = document.getElementById('sync-bubble');
    bubble.textContent = 'Comando de voz não é suportado neste navegador. Tente pelo Chrome.';
    bubble.hidden = false;
    setTimeout(() => { bubble.hidden = true; }, 7000);
    return;
  }
  SyncAssistant.start();
});
document.addEventListener('sync-listen-start', () => document.getElementById('sync-btn').classList.add('listening'));
document.addEventListener('sync-listen-end', () => document.getElementById('sync-btn').classList.remove('listening'));
document.addEventListener('sync-speak-start', () => document.getElementById('sync-btn').classList.add('speaking'));
document.addEventListener('sync-speak-end', () => document.getElementById('sync-btn').classList.remove('speaking'));

function handleSyncIntent(intent, texto){
  switch(intent){
    case 'navegar_vendas':
    case 'navegar_agenda':
      syncSay('Te levando pro painel principal.');
      localStorage.setItem('polo-selecionado', selectedPoloId);
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
      break;
    case 'navegar_financeiro':
      syncSay('Abrindo o Financeiro.');
      localStorage.setItem('polo-selecionado', selectedPoloId);
      setTimeout(() => { window.location.href = 'financeiro.html'; }, 900);
      break;
    case 'navegar_relatorios':
      syncSay('Abrindo os Relatórios.');
      localStorage.setItem('polo-selecionado', selectedPoloId);
      setTimeout(() => { window.location.href = 'relatorios.html'; }, 900);
      break;
    default:
      syncSay('Aqui nessa tela eu só navego pra outras abas. Quer tentar de novo?');
  }
}
