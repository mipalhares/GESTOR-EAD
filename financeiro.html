<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoloSync - Financeiro</title>
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoloSync">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171B26; --panel:#1F2433; --panel-alt:#262C3F; --border:#333B52;
    --text:#ECE9E1; --text-muted:#9098AF;
    --gold:#D6A756; --teal:#4FA98C; --red:#C1666B; --blue:#6C8EBF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  #config-warning{background:rgba(193,102,107,0.12);border:1px solid var(--red);color:var(--red);padding:14px;border-radius:10px;font-size:12.5px;max-width:420px;margin:20px auto;text-align:center;}

  .topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .topbar h1{font-size:20px;}
  #btn-back{background:none;border:1px solid var(--border);color:var(--text-muted);padding:7px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .spacer{flex:1;}
  #select-polo{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;}
  .small-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;}
  .btn-primary{background:var(--gold);color:#1B1B14;border:none;padding:9px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-secondary{background:none;border:1px solid var(--border);color:var(--text-muted);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;}
  .btn-danger{background:none;border:none;color:var(--red);font-size:12.5px;cursor:pointer;text-decoration:underline;}

  .nav{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;}
  .nav button{background:none;border:none;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;}
  .nav button:hover{background:var(--panel-alt);}
  .nav .range{padding:0 6px;color:var(--text-muted);font-size:12.5px;white-space:nowrap;}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:20px 28px;}
  .metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .metric .value{font-family:'Fraunces',serif;font-size:26px;font-weight:500;}
  .metric .label{color:var(--text-muted);font-size:12.5px;margin-top:4px;}
  .metric.positivo .value{color:var(--teal);}
  .metric.negativo .value{color:var(--red);}

  .layout{display:flex;gap:20px;padding:0 28px 28px 28px;flex-wrap:wrap;}
  .col-chart{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .col-list{flex:2;min-width:340px;}

  .chart-bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin-top:14px;}
  .chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .chart-bar{width:100%;border-radius:4px 4px 0 0;background:var(--teal);min-height:2px;}
  .chart-bar.negativo{background:var(--red);}
  .chart-label{font-size:10px;color:var(--text-muted);margin-top:6px;}

  .tx-row{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;flex-wrap:wrap;}
  .tx-row:hover{border-color:var(--gold);}
  .tx-row.repasse{border-left-color:var(--gold);}
  .tx-row.receita{border-left-color:var(--teal);}
  .tx-row.despesa{border-left-color:var(--red);}
  .tx-info .tx-desc{font-size:13.5px;font-weight:600;}
  .tx-info .tx-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
  .tx-valor{font-family:'Fraunces',serif;font-size:15px;white-space:nowrap;}
  .tx-valor.despesa{color:var(--red);}
  .tx-valor.receita, .tx-valor.repasse{color:var(--teal);}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,12,18,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay[hidden]{display:none;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:440px;padding:26px;max-height:88vh;overflow-y:auto;}
  .modal h2{font-size:19px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;font-family:'Inter';font-size:13.5px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  #loading-screen{padding:60px;text-align:center;color:var(--text-muted);}
</style>
</head>
<body>

<div id="config-warning" style="display:none;">
  ⚠️ Configuração pendente: cole o mesmo firebaseConfig usado no index.html na seção CONFIGURAÇÃO deste arquivo.
</div>

<div id="loading-screen">Carregando...</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <button id="btn-back">← Voltar</button>
    <h1>Financeiro do Polo</h1>
    <div class="spacer"></div>
    <label style="font-size:11.5px;color:var(--text-muted);">POLO</label>
    <select id="select-polo"></select>
  </div>

  <div class="topbar">
    <div class="nav">
      <button id="nav-prev">←</button>
      <span class="range" id="mes-range"></span>
      <button id="nav-today">Hoje</button>
      <button id="nav-next">→</button>
    </div>
    <div class="spacer"></div>
    <button class="small-btn" id="btn-export-fin">⬇️ Exportar CSV</button>
    <button class="btn-primary" id="btn-new-tx">+ Nova transação</button>
  </div>

  <div class="metrics" id="fin-metrics"></div>

  <div class="layout">
    <div class="col-chart">
      <h3 style="font-size:14px;">Líquido nos últimos 6 meses</h3>
      <div class="chart-bars" id="chart-bars"></div>
    </div>
    <div class="col-list">
      <div id="tx-list"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-tx" hidden>
  <div class="modal">
    <h2 id="tx-modal-title">Nova transação</h2>
    <form id="tx-form">
      <div class="field"><label>Tipo</label>
        <select id="t-tipo">
          <option value="repasse">Repasse recebido</option>
          <option value="receita">Receita do polo</option>
          <option value="despesa">Despesa</option>
        </select>
      </div>
      <div class="field" id="t-categoria-block" hidden>
        <label>Categoria</label>
        <select id="t-categoria">
          <option>Aluguel</option><option>Salários e comissões</option><option>Marketing</option>
          <option>Manutenção e infraestrutura</option><option>Material didático</option>
          <option>Contas (água, luz, internet)</option><option>Outros</option>
        </select>
      </div>
      <div class="field"><label>Descrição</label><input type="text" id="t-descricao" required placeholder="Ex: Repasse de setembro, Aluguel da sala..."></div>
      <div class="field-row">
        <div class="field"><label>Valor (R$)</label><input type="number" id="t-valor" step="0.01" min="0" required></div>
        <div class="field"><label>Data</label><input type="date" id="t-data" required></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="btn-delete-tx" hidden>Excluir</button>
        <div style="flex:1"></div>
        <button type="button" class="btn-secondary" id="btn-cancel-tx">Cancelar</button>
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ============ CONFIGURAÇÃO ============ */
// Cole aqui o MESMO firebaseConfig usado no index.html
const firebaseConfig = {
  apiKey: "AIzaSyASApoPVmsNyTmcNSrxlTZ5yU7WGN7lR3o",
  authDomain: "gestor-ead.firebaseapp.com",
  projectId: "gestor-ead",
  storageBucket: "gestor-ead.firebasestorage.app",
  messagingSenderId: "690843825301",
  appId: "1:690843825301:web:0c389349ba9eed8582179c",
};
if(firebaseConfig.apiKey === "COLE_AQUI"){
  document.getElementById('config-warning').style.display = 'block';
}

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const MES_NOMES = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const TIPO_LABEL = { repasse:'Repasse recebido', receita:'Receita do polo', despesa:'Despesa' };

let currentUser = null;
let polos = [];
let selectedPoloId = null;
let transacoes = []; // todas as transações do polo (carregadas uma vez)
let mesOffset = 0; // 0 = mês atual
let editingTxId = null;

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function formatMoney(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function formatDateBR(dateStr){ if(!dateStr) return ''; const [y,m,d]=dateStr.split('-'); return `${d}/${m}/${y}`; }
function getMonthDate(offset){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  return d;
}
function monthKey(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`; }

document.getElementById('btn-back').addEventListener('click', () => window.location.href = 'index.html');

onAuthStateChanged(auth, async (user) => {
  if(!user){ window.location.href = 'index.html'; return; }
  currentUser = user;
  await loadPolos();
  renderPoloSelect();
  await loadTransacoes();
  render();
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
});

async function loadPolos(){
  const q = query(collection(db, 'polos'), where('gestores', 'array-contains', currentUser.uid));
  const snap = await getDocs(q);
  polos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const saved = localStorage.getItem('polo-selecionado');
  selectedPoloId = polos.find(p => p.id === saved) ? saved : (polos[0] ? polos[0].id : null);
}
function renderPoloSelect(){
  document.getElementById('select-polo').innerHTML = polos.map(p =>
    `<option value="${p.id}" ${p.id===selectedPoloId?'selected':''}>${escapeHtml(p.nome)}</option>`).join('');
}
document.getElementById('select-polo').addEventListener('change', async e => {
  selectedPoloId = e.target.value;
  localStorage.setItem('polo-selecionado', selectedPoloId);
  await loadTransacoes();
  render();
});

async function loadTransacoes(){
  if(!selectedPoloId){ transacoes = []; return; }
  const snap = await getDocs(collection(db, 'polos', selectedPoloId, 'financeiro'));
  transacoes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (b.data || '').localeCompare(a.data || ''));
}

document.getElementById('nav-prev').addEventListener('click', () => { mesOffset--; render(); });
document.getElementById('nav-next').addEventListener('click', () => { mesOffset++; render(); });
document.getElementById('nav-today').addEventListener('click', () => { mesOffset = 0; render(); });

function getTxDoMes(offset){
  const d = getMonthDate(offset);
  const key = monthKey(d);
  return transacoes.filter(t => (t.data || '').slice(0,7) === key);
}

function render(){
  const d = getMonthDate(mesOffset);
  document.getElementById('mes-range').textContent = `${MES_NOMES[d.getMonth()+1]} de ${d.getFullYear()}`;

  const doMes = getTxDoMes(mesOffset);
  const repasses = doMes.filter(t => t.tipo === 'repasse').reduce((s,t) => s + Number(t.valor||0), 0);
  const receita = doMes.filter(t => t.tipo === 'receita').reduce((s,t) => s + Number(t.valor||0), 0);
  const despesas = doMes.filter(t => t.tipo === 'despesa').reduce((s,t) => s + Number(t.valor||0), 0);
  const liquido = repasses + receita - despesas;

  document.getElementById('fin-metrics').innerHTML = `
    <div class="metric"><div class="value">${formatMoney(repasses)}</div><div class="label">Repasses recebidos</div></div>
    <div class="metric"><div class="value">${formatMoney(receita)}</div><div class="label">Receita do polo</div></div>
    <div class="metric"><div class="value">${formatMoney(despesas)}</div><div class="label">Despesas do mês</div></div>
    <div class="metric ${liquido>=0?'positivo':'negativo'}"><div class="value">${formatMoney(liquido)}</div><div class="label">Resultado líquido</div></div>
  `;

  // Gráfico dos últimos 6 meses (do mês selecionado pra trás)
  const meses = [];
  for(let i=5;i>=0;i--) meses.push(mesOffset - i);
  const liquidos = meses.map(off => {
    const tx = getTxDoMes(off);
    const r = tx.filter(t=>t.tipo==='repasse').reduce((s,t)=>s+Number(t.valor||0),0);
    const rc = tx.filter(t=>t.tipo==='receita').reduce((s,t)=>s+Number(t.valor||0),0);
    const de = tx.filter(t=>t.tipo==='despesa').reduce((s,t)=>s+Number(t.valor||0),0);
    return { off, liquido: r+rc-de };
  });
  const maxAbs = Math.max(1, ...liquidos.map(l => Math.abs(l.liquido)));
  document.getElementById('chart-bars').innerHTML = liquidos.map(l => {
    const dm = getMonthDate(l.off);
    const alturaPct = Math.max(2, Math.round((Math.abs(l.liquido)/maxAbs)*100));
    return `<div class="chart-bar-col">
      <div class="chart-bar ${l.liquido<0?'negativo':''}" style="height:${alturaPct}%;" title="${formatMoney(l.liquido)}"></div>
      <div class="chart-label">${MES_NOMES[dm.getMonth()+1].slice(0,3)}</div>
    </div>`;
  }).join('');

  const list = document.getElementById('tx-list');
  if(doMes.length === 0){
    list.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Nenhuma transação neste mês.</div>';
    return;
  }
  list.innerHTML = doMes.map(t => `
    <div class="tx-row ${t.tipo}" data-id="${t.id}">
      <div class="tx-info">
        <div class="tx-desc">${escapeHtml(t.descricao)}</div>
        <div class="tx-meta">${TIPO_LABEL[t.tipo]}${t.categoria ? ' · '+escapeHtml(t.categoria) : ''} · ${formatDateBR(t.data)}</div>
      </div>
      <div class="tx-valor ${t.tipo}">${t.tipo==='despesa' ? '-' : '+'} ${formatMoney(t.valor)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.tx-row').forEach(row => {
    row.addEventListener('click', () => openTxModal(row.dataset.id));
  });
}

document.getElementById('t-tipo').addEventListener('change', () => {
  document.getElementById('t-categoria-block').hidden = document.getElementById('t-tipo').value !== 'despesa';
});

function openTxModal(id=null){
  editingTxId = id;
  document.getElementById('tx-form').reset();
  document.getElementById('t-categoria-block').hidden = true;
  const btnDel = document.getElementById('btn-delete-tx');
  if(id){
    const t = transacoes.find(x => x.id === id);
    document.getElementById('tx-modal-title').textContent = 'Editar transação';
    document.getElementById('t-tipo').value = t.tipo;
    document.getElementById('t-categoria-block').hidden = t.tipo !== 'despesa';
    document.getElementById('t-categoria').value = t.categoria || 'Outros';
    document.getElementById('t-descricao').value = t.descricao;
    document.getElementById('t-valor').value = t.valor;
    document.getElementById('t-data').value = t.data;
    btnDel.hidden = false;
  } else {
    document.getElementById('tx-modal-title').textContent = 'Nova transação';
    document.getElementById('t-tipo').value = 'despesa';
    document.getElementById('t-categoria-block').hidden = false;
    const d = getMonthDate(mesOffset);
    const hoje = new Date();
    document.getElementById('t-data').value = (hoje.getFullYear()===d.getFullYear() && hoje.getMonth()===d.getMonth())
      ? hoje.toISOString().slice(0,10)
      : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    btnDel.hidden = true;
  }
  document.getElementById('modal-tx').hidden = false;
}
document.getElementById('btn-new-tx').addEventListener('click', () => openTxModal());
document.getElementById('btn-cancel-tx').addEventListener('click', () => document.getElementById('modal-tx').hidden = true);

document.getElementById('tx-form').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {
    tipo: document.getElementById('t-tipo').value,
    descricao: document.getElementById('t-descricao').value.trim(),
    valor: Number(document.getElementById('t-valor').value) || 0,
    data: document.getElementById('t-data').value,
  };
  if(data.tipo === 'despesa'){ data.categoria = document.getElementById('t-categoria').value; }
  if(!data.descricao || !data.data) return;
  if(editingTxId){
    await updateDoc(doc(db, 'polos', selectedPoloId, 'financeiro', editingTxId), data);
  } else {
    data.criadoEm = new Date().toISOString();
    await addDoc(collection(db, 'polos', selectedPoloId, 'financeiro'), data);
  }
  document.getElementById('modal-tx').hidden = true;
  await loadTransacoes();
  render();
});
document.getElementById('btn-delete-tx').addEventListener('click', async () => {
  if(!editingTxId || !confirm('Excluir esta transação?')) return;
  await deleteDoc(doc(db, 'polos', selectedPoloId, 'financeiro', editingTxId));
  document.getElementById('modal-tx').hidden = true;
  await loadTransacoes();
  render();
});

function csvEscape(v){ return `"${String(v ?? '').replace(/"/g,'""').replace(/\n/g,' ')}"`; }
document.getElementById('btn-export-fin').addEventListener('click', () => {
  const doMes = getTxDoMes(mesOffset);
  const header = ['Tipo','Descrição','Categoria','Valor','Data'];
  const lines = [header.map(csvEscape).join(';')];
  doMes.forEach(t => {
    lines.push([TIPO_LABEL[t.tipo], t.descricao, t.categoria||'', t.valor, t.data].map(csvEscape).join(';'));
  });
  const d = getMonthDate(mesOffset);
  const poloNome = (polos.find(p => p.id === selectedPoloId) || {}).nome || 'polo';
  const blob = new Blob(["\uFEFF" + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `financeiro-${poloNome.replace(/\s+/g,'-')}-${d.getMonth()+1}-${d.getFullYear()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
