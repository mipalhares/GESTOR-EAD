<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Polo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171B26; --panel:#1F2433; --panel-alt:#262C3F; --border:#333B52;
    --text:#ECE9E1; --text-muted:#9098AF;
    --gold:#D6A756; --teal:#4FA98C; --red:#C1666B;
    --tag-b2b:#6C8EBF; --tag-b2c:#B48EAD;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}

  #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .auth-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;width:100%;max-width:360px;}
  .auth-box h1{font-size:22px;margin-bottom:6px;}
  .auth-box p.sub{color:var(--text-muted);font-size:13px;margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:7px;font-family:'Inter';font-size:13.5px;}
  .field textarea{resize:vertical;min-height:55px;}
  .btn-primary{background:var(--gold);color:#1B1B14;border:none;padding:10px 20px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;width:100%;}
  .btn-secondary{background:none;border:1px solid var(--border);color:var(--text-muted);padding:10px 16px;border-radius:8px;font-size:13.5px;cursor:pointer;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:12.5px;cursor:pointer;text-decoration:underline;margin-top:14px;display:block;text-align:center;width:100%;}
  #auth-error{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
  #config-warning{background:rgba(193,102,107,0.12);border:1px solid var(--red);color:var(--red);padding:14px;border-radius:10px;font-size:12.5px;max-width:420px;margin:20px auto;text-align:center;}

  #app{display:none;}
  .polobar{display:flex;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--border);background:var(--panel-alt);flex-wrap:wrap;}
  .polobar label{font-size:11.5px;color:var(--text-muted);}
  #select-polo{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;}
  .small-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;}
  .spacer{flex:1;}
  #user-email{font-size:12px;color:var(--text-muted);}

  .topbar{display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .maintabs{display:flex;gap:4px;}
  .maintabs button{background:var(--panel);border:1px solid var(--border);color:var(--text-muted);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .maintabs button.active{background:var(--gold);color:#1B1B14;border-color:var(--gold);}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .tabs button{background:none;border:none;color:var(--text-muted);padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;}
  .tabs button.active{background:var(--panel-alt);color:var(--text);}
  #search{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;min-width:170px;}
  #btn-whatsapp{background:var(--teal);color:#0F1B17;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
  #btn-new-lead, #btn-new-evento{background:var(--gold);color:#1B1B14;border:none;padding:9px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}

  .view{display:none;}
  .view.active{display:block;}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:20px 28px;}
  .metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .metric .value{font-family:'Fraunces',serif;font-size:28px;font-weight:500;}
  .metric .label{color:var(--text-muted);font-size:12.5px;margin-top:4px;}
  .metric.warn .value{color:var(--red);}

  .board{display:flex;gap:14px;padding:6px 28px 28px 28px;overflow-x:auto;align-items:flex-start;}
  .column{background:var(--panel);border:1px solid var(--border);border-radius:12px;min-width:240px;max-width:240px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 320px);}
  .column.dragover{border-color:var(--gold);}
  .column-header{padding:12px 14px 8px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;}
  .column-header h3{font-size:13.5px;}
  .column-header span{color:var(--text-muted);font-size:12px;}
  .column-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;}
  .column-body:empty::after{content:"Sem leads aqui";color:var(--text-muted);font-size:12px;text-align:center;padding:16px 4px;display:block;}

  .card{background:var(--panel-alt);border:1px solid var(--border);border-radius:9px;padding:11px 12px;cursor:grab;}
  .card:hover{border-color:var(--gold);}
  .card.dragging{opacity:0.4;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .card-name{font-size:13px;font-weight:600;}
