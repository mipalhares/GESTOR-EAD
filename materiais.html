<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoloSync - Materiais para Redes</title>
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A2463">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PoloSync">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171B26; --panel:#1F2433; --panel-alt:#262C3F; --border:#333B52;
    --text:#ECE9E1; --text-muted:#9098AF;
    --gold:#D6A756; --teal:#4FA98C; --red:#C1666B; --blue:#6C8EBF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  #loading-screen{padding:60px;text-align:center;color:var(--text-muted);}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .topbar h1{font-size:20px;}
  #btn-back{background:none;border:1px solid var(--border);color:var(--text-muted);padding:7px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .spacer{flex:1;}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px;flex-wrap:wrap;}
  .tabs button{background:none;border:none;color:var(--text-muted);padding:7px 12px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;}
  .tabs button.active{background:var(--panel-alt);color:var(--text);}
  .btn-primary{background:var(--gold);color:#1B1B14;border:none;padding:9px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:none;border:1px solid var(--border);color:var(--text-muted);padding:8px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;}
  .btn-danger{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;text-decoration:underline;}
  .hint{color:var(--text-muted);font-size:12.5px;line-height:1.5;margin:0 0 10px 0;}

  .admin-box{margin:20px 28px 0 28px;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:18px 20px;}
  .admin-box h3{font-size:15px;margin-bottom:10px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;}
  .field input[type=text],.field input[type=url],.field input[type=date],.field select,.field textarea{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px;font-family:inherit;}
  .field textarea{min-height:80px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:600px){.row2{grid-template-columns:1fr;}.topbar,.admin-box{margin-left:0;margin-right:0;} .admin-box{margin:16px;} .topbar{padding:14px 16px;} .grid{padding:16px !important;}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px 28px 40px 28px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .thumb{aspect-ratio:1/1;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;font-size:40px;position:relative;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .badge{position:absolute;top:8px;left:8px;background:rgba(23,27,38,.85);border:1px solid var(--border);border-radius:6px;font-size:11px;padding:3px 8px;}
  .badge.baixado{left:auto;right:8px;color:var(--teal);border-color:var(--teal);}
  .card-body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-title{font-size:13.5px;font-weight:600;}
  .card-meta{font-size:11.5px;color:var(--text-muted);}
  .card-cap{font-size:12.5px;color:var(--text);opacity:.85;white-space:pre-wrap;max-height:90px;overflow:auto;background:var(--panel-alt);border-radius:8px;padding:8px 10px;}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px;}
  .empty{padding:50px 28px;text-align:center;color:var(--text-muted);font-size:13.5px;}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-alt);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;display:none;z-index:50;}
</style>
<link rel="stylesheet" href="tema.css">
</head>
<body>
<div id="loading-screen">Carregando...</div>
<div id="app" style="display:none;">
  <div class="topbar">
    <button id="btn-back">← Voltar</button>
    <h1>📣 Materiais para Redes</h1>
  </div>

  <div style="height:14px"></div>

  <div class="mat-card" id="mat-semana"></div>

  <div class="mat-card">
    <h2>📸 Biblioteca de mídias</h2>
    <p style="font-size:13.5px;color:var(--text-muted);margin-bottom:10px;">Posts, reels e stories prontos para baixar, com legenda e calendário de postagens.</p>
    <button class="btn-primary" id="btn-ir-midias">Abrir biblioteca de mídias</button>
  </div>

  <div class="mat-card" id="mat-proximas"></div>
  <div class="mat-card" id="mat-links"></div>
</div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { verificarAcesso, mostrarTelaBloqueio } from "./acesso.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { proximaSemana, datasEntre, fmtDM, fmtDiaSemana, campanhaDoMes, ideiasDe, legendaBase } from "./datas.js";

const firebaseConfig = {
  apiKey: "AIzaSyASApoPVmsNyTmcNSrxlTZ5yU7WGN7lR3o",
  authDomain: "gestor-ead.firebaseapp.com",
  projectId: "gestor-ead",
  storageBucket: "gestor-ead.firebasestorage.app",
  messagingSenderId: "690843825301",
  appId: "1:690843825301:web:0c389349ba9eed8582179c",
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const LINKS = [
  { icone:'📤', titulo:'Entrega dos planejamentos', desc:'Pasta de entrega no Brightspace (AVA)', url:'https://adventistas.brightspace.com/d2l/login?target=%2fd2l%2flms%2fdropbox%2fuser%2ffolder_submit_files.d2l%3fou%3d60348%26isprv%3d0%26db%3d66930%26cfql%3d0&sessionExpired=1' },
  { icone:'🛒', titulo:'Portal comercial', desc:'Materiais e orientações comerciais dos polos', url:'https://sites.google.com/view/polosead/portal' },
];
let nomePolo = '';
const legendas = [];
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2400); }

function render(){
  const {ini, fim} = proximaSemana();
  const datas = datasEntre(ini, fim);
  const camp = campanhaDoMes(ini);
  let h = `<h2>🗓️ Semana que vem (${fmtDM(ini)} a ${fmtDM(fim)})</h2>
    <p style="font-size:13.5px;color:var(--text-muted);">Programe-se: separe um tempo para produzir os conteúdos destas datas.</p>`;
  if(camp) h += `<p style="margin-top:8px;font-weight:600;color:var(--navy);">🎗️ Campanha do mês: ${camp}</p>`;
  if(!datas.length) h += `<div class="mat-data">Nenhuma data comemorativa na semana que vem. Aproveite para adiantar conteúdos da próxima data da lista abaixo.</div>`;
  datas.forEach(d => {
    const i = legendas.push(legendaBase(d.nome, nomePolo)) - 1;
    h += `<div class="mat-data"><h4>${d.ico} ${fmtDM(d.data)} (${fmtDiaSemana(d.data)}) — ${escapeHtml(d.nome)}</h4>
      <ul>${ideiasDe(d.nome).map(x => `<li><b>${x.t}:</b> ${escapeHtml(x.d)}</li>`).join('')}</ul>
      <button class="small-btn" data-leg="${i}">📋 Copiar legenda sugerida</button></div>`;
  });
  document.getElementById('mat-semana').innerHTML = h;

  const hoje = new Date(); const lim = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()+60);
  const prox = datasEntre(hoje, lim);
  document.getElementById('mat-proximas').innerHTML = `<h2>📅 Próximos 60 dias</h2>` +
    (prox.length ? prox.map(d => `<div class="mat-prox"><b>${fmtDM(d.data)} (${fmtDiaSemana(d.data)})</b><span>${d.ico} ${escapeHtml(d.nome)}</span></div>`).join('') : '<p>Nenhuma data cadastrada neste período.</p>');

  document.getElementById('mat-links').innerHTML = `<h2>🔗 Links importantes</h2><div class="links-grid" style="margin-top:8px;">` +
    LINKS.map(l => `<a class="link-item" href="${l.url}" target="_blank" rel="noopener"><span class="li-ico">${l.icone}</span><span><b>${l.titulo}</b><small>${l.desc}</small></span></a>`).join('') + '</div>';

  document.querySelectorAll('[data-leg]').forEach(b => b.addEventListener('click', async () => {
    const t = legendas[Number(b.dataset.leg)];
    try{ await navigator.clipboard.writeText(t); toast('Legenda copiada!'); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Legenda copiada!'); }
  }));
}

document.getElementById('btn-back').addEventListener('click', () => window.location.href = 'index.html');
document.getElementById('btn-ir-midias').addEventListener('click', () => window.location.href = 'midia.html');

onAuthStateChanged(auth, async (user) => {
  if(!user){ window.location.href = 'index.html'; return; }
  const acesso = await verificarAcesso(db, user);
  if(!acesso.liberado){
    document.getElementById('loading-screen').style.display = 'none';
    mostrarTelaBloqueio(acesso, user, () => { window.location.href = 'index.html'; });
    return;
  }
  try{
    const id = localStorage.getItem('polo-selecionado');
    if(id){ const p = await getDoc(doc(db,'polos',id)); if(p.exists()) nomePolo = p.data().nome || ''; }
  }catch(e){}
  render();
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
});
</script>
</body>
</html>
