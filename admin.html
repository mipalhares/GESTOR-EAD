<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoloSync — Administração</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1722">
<style>
  :root{--bg:#f3f5f9;--panel:#fff;--border:#dde3ec;--text:#1b2430;--muted:#6b7789;--primary:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--gray:#64748b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#0f1722;color:#fff;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;flex:1;}
  button{font:inherit;cursor:pointer;}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13.5px;}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.green{background:var(--green);border-color:var(--green);color:#fff;}
  .btn.danger{color:var(--red);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  main{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
  .metric{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .metric b{display:block;font-size:22px;}
  .metric span{font-size:12px;color:var(--muted);}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tabs button{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;}
  .tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .row .grow{flex:1;min-width:180px;}
  .email{font-weight:600;word-break:break-all;}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;}
  .b-ativo{background:var(--green);}.b-pendente{background:var(--amber);}.b-vencendo{background:#ea580c;}
  .b-expirado{background:var(--red);}.b-suspenso{background:var(--gray);}.b-admin{background:#7c3aed;}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%;}
  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .filters input{flex:1;min-width:180px;}.filters select{width:auto;}
  label{font-size:12.5px;color:var(--muted);display:block;margin:10px 0 4px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:20px;max-width:460px;width:100%;max-height:92vh;overflow:auto;}
  .modal h3{margin:0 0 4px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .msg{font-size:13px;margin-top:8px;}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.5;}
  #loading{padding:60px;text-align:center;color:var(--muted);}
  .tag{display:inline-block;background:#eef2f7;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0;}
</style>
</head>
<body>
<header>
  <h1>🛡️ PoloSync — Administração</h1>
  <button class="btn sm" id="btn-voltar">← Voltar ao app</button>
</header>
<main>
  <div id="loading">Carregando...</div>
  <div id="conteudo" style="display:none;">
    <div class="metrics" id="metrics"></div>
    <div class="tabs">
      <button data-tab="gestores" class="active">Gestores</button>
      <button data-tab="polos">Polos</button>
      <button data-tab="config">Configurações</button>
    </div>

    <section id="tab-gestores">
      <div class="filters">
        <input id="busca" placeholder="Buscar por e-mail...">
        <select id="filtro">
          <option value="todos">Todos</option>
          <option value="pendente">Aguardando liberação</option>
          <option value="ativo">Ativos</option>
          <option value="vencendo">Vencendo (≤ 7 dias)</option>
          <option value="expirado">Vencidos</option>
          <option value="suspenso">Suspensos</option>
        </select>
      </div>
      <div id="lista-gestores"></div>
    </section>

    <section id="tab-polos" style="display:none;">
      <div class="card">
        <b>Criar polo para um gestor</b>
        <div class="row" style="margin-top:8px;">
          <div class="grow"><input id="novo-polo-nome" placeholder="Nome do polo"></div>
          <div class="grow"><select id="novo-polo-gestor"></select></div>
          <button class="btn primary" id="btn-criar-polo">Criar</button>
        </div>
        <div class="msg" id="msg-polo"></div>
      </div>
      <div id="lista-polos"></div>
    </section>

    <section id="tab-config" style="display:none;">
      <div class="card">
        <b>Contato e mensagem de bloqueio</b>
        <p class="hint">Aparecem na tela que o gestor vê quando o acesso está pendente, vencido ou suspenso.</p>
        <label>Seu WhatsApp (com DDD, só números — ex.: 5517999999999)</label>
        <input id="cfg-contato" placeholder="5517999999999">
        <label>Mensagem opcional (ex.: valor, Pix, como renovar)</label>
        <textarea id="cfg-msg" rows="4" placeholder="Ex.: Plano mensal R$ 49. Pix: ..."></textarea>
        <div style="margin-top:12px;"><button class="btn primary" id="btn-salvar-cfg">Salvar</button></div>
        <div class="msg" id="msg-cfg"></div>
      </div>
    </section>
  </div>
</main>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="m-email"></h3>
    <div class="sub" id="m-status"></div>
    <label>Situação</label>
    <select id="m-ativo"><option value="true">Ativo (liberado)</option><option value="false">Suspenso (bloqueado)</option></select>
    <label>Vence em</label>
    <input type="date" id="m-expira">
    <div class="chips">
      <button class="btn sm" data-add="30">+30 dias</button>
      <button class="btn sm" data-add="90">+90 dias</button>
      <button class="btn sm" data-add="365">+1 ano</button>
      <button class="btn sm" data-add="0">Sem vencimento</button>
    </div>
    <label>Observações internas (só você vê)</label>
    <textarea id="m-obs" rows="3" placeholder="Ex.: pagou via Pix em 10/10"></textarea>
    <label>Polos deste gestor</label>
    <div id="m-polos"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end;">
      <button class="btn" id="m-fechar">Cancelar</button>
      <button class="btn primary" id="m-salvar">Salvar</button>
    </div>
    <div class="msg" id="m-msg"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, arrayUnion, arrayRemove, Timestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyASApoPVmsNyTmcNSrxlTZ5yU7WGN7lR3o",
  authDomain: "gestor-ead.firebaseapp.com",
  projectId: "gestor-ead",
  storageBucket: "gestor-ead.firebasestorage.app",
  messagingSenderId: "690843825301",
  appId: "1:690843825301:web:0c389349ba9eed8582179c",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let usuarios = [], assinaturas = {}, polos = [], adminUid = null, editUid = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? d.toLocaleDateString('pt-BR') : '—';
const toInput = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';
const fimDoDia = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59);
const expDate = a => a && a.expiraEm ? (a.expiraEm.toDate ? a.expiraEm.toDate() : new Date(a.expiraEm)) : null;

$('btn-voltar').onclick = () => location.href = 'index.html';

onAuthStateChanged(auth, async (user) => {
  if(!user){ location.href = 'index.html'; return; }
  try{
    const adm = await getDoc(doc(db, 'admins', user.uid));
    if(!adm.exists()){ location.href = 'index.html'; return; }
    adminUid = user.uid;
    await carregar();
    $('loading').style.display = 'none';
    $('conteudo').style.display = 'block';
  }catch(e){
    $('loading').innerHTML = '⚠️ Erro: ' + esc(e.message) + '<br><br>Verifique se as regras do Firestore novas foram publicadas.';
  }
});

async function carregar(){
  const [u, a, p, c] = await Promise.all([
    getDocs(collection(db, 'usuarios')),
    getDocs(collection(db, 'assinaturas')),
    getDocs(collection(db, 'polos')),
    getDoc(doc(db, 'config', 'geral')),
  ]);
  usuarios = u.docs.map(d => ({ uid: d.id, ...d.data() })).sort((x, y) => (x.email || '').localeCompare(y.email || ''));
  assinaturas = {}; a.docs.forEach(d => assinaturas[d.id] = d.data());
  polos = p.docs.map(d => ({ id: d.id, ...d.data() }));
  if(c.exists()){ $('cfg-contato').value = c.data().contatoAdmin || ''; $('cfg-msg').value = c.data().mensagemBloqueio || ''; }
  renderTudo();
}

function situacao(uid){
  if(uid === adminUid) return 'admin';
  const a = assinaturas[uid];
  if(!a) return 'pendente';
  if(a.ativo !== true) return 'suspenso';
  const e = expDate(a);
  if(!e) return 'ativo';
  const dias = (e.getTime() - Date.now()) / 86400000;
  if(dias < 0) return 'expirado';
  if(dias <= 7) return 'vencendo';
  return 'ativo';
}
const ROTULO = { admin:'Administrador', pendente:'Aguardando', ativo:'Ativo', vencendo:'Vencendo', expirado:'Vencido', suspenso:'Suspenso' };

function renderTudo(){ renderMetrics(); renderGestores(); renderPolos(); renderSelectGestores(); }

function renderMetrics(){
  const cont = {}; usuarios.forEach(u => { const s = situacao(u.uid); cont[s] = (cont[s] || 0) + 1; });
  const m = (n, l) => `<div class="metric"><b>${n}</b><span>${l}</span></div>`;
  $('metrics').innerHTML = m(usuarios.length, 'Contas') + m((cont.ativo||0)+(cont.vencendo||0), 'Ativos') + m(cont.pendente||0, 'Aguardando') + m(cont.vencendo||0, 'Vencendo') + m(cont.expirado||0, 'Vencidos') + m(polos.length, 'Polos');
}

function renderGestores(){
  const q = $('busca').value.trim().toLowerCase(), f = $('filtro').value;
  const lista = usuarios.filter(u => (!q || (u.email || '').toLowerCase().includes(q)) && (f === 'todos' || situacao(u.uid) === f));
  if(!lista.length){ $('lista-gestores').innerHTML = '<div class="card hint">Nenhum gestor encontrado.</div>'; return; }
  $('lista-gestores').innerHTML = lista.map(u => {
    const s = situacao(u.uid), a = assinaturas[u.uid], e = expDate(a);
    const nPolos = polos.filter(p => (p.gestores || []).includes(u.uid)).length;
    const info = s === 'admin' ? 'Acesso total' : (a ? `Vence: ${e ? fmt(e) : 'sem vencimento'}` : 'Ainda sem liberação');
    return `<div class="card"><div class="row">
      <div class="grow"><div class="email">${esc(u.email)}</div><div class="sub">${info} · ${nPolos} polo(s)${a && a.obs ? ' · 📝 ' + esc(a.obs) : ''}</div></div>
      <span class="badge b-${s}">${ROTULO[s]}</span>
      ${s !== 'admin' ? `<button class="btn green sm" data-liberar="${u.uid}">✅ Liberar 30 dias</button><button class="btn sm" data-gerir="${u.uid}">Gerenciar</button>` : ''}
    </div></div>`;
  }).join('');
  document.querySelectorAll('[data-liberar]').forEach(b => b.onclick = () => liberar(b.dataset.liberar, 30, b));
  document.querySelectorAll('[data-gerir]').forEach(b => b.onclick = () => abrirModal(b.dataset.gerir));
}
$('busca').oninput = renderGestores; $('filtro').onchange = renderGestores;

async function liberar(uid, dias, btn){
  if(btn) btn.disabled = true;
  try{
    // Se ainda está no prazo, soma a partir do vencimento atual
    const atual = expDate(assinaturas[uid]);
    const base = atual && atual.getTime() > Date.now() ? atual : new Date();
    const d = new Date(base); d.setDate(d.getDate() + dias);
    const dados = { ativo: true, expiraEm: Timestamp.fromDate(fimDoDia(d)), atualizadoEm: new Date().toISOString() };
    await setDoc(doc(db, 'assinaturas', uid), dados, { merge: true });
    assinaturas[uid] = { ...(assinaturas[uid] || {}), ...dados };
    renderTudo();
  }catch(e){ alert('Erro: ' + e.message); if(btn) btn.disabled = false; }
}

/* ---- Modal ---- */
function abrirModal(uid){
  editUid = uid;
  const u = usuarios.find(x => x.uid === uid), a = assinaturas[uid] || {}, e = expDate(a);
  $('m-email').textContent = u.email;
  $('m-status').textContent = 'Situação atual: ' + ROTULO[situacao(uid)];
  $('m-ativo').value = String(a.ativo === true || !assinaturas[uid]);
  $('m-expira').value = toInput(e);
  $('m-obs').value = a.obs || '';
  $('m-msg').textContent = '';
  const meus = polos.filter(p => (p.gestores || []).includes(uid));
  $('m-polos').innerHTML = meus.length ? meus.map(p => `<span class="tag">${esc(p.nome)}</span>`).join('') : '<span class="hint">Nenhum polo ainda.</span>';
  $('modal-bg').classList.add('open');
}
$('m-fechar').onclick = () => $('modal-bg').classList.remove('open');
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
  const n = Number(b.dataset.add);
  if(n === 0){ $('m-expira').value = ''; return; }
  const atual = $('m-expira').value ? new Date($('m-expira').value + 'T12:00:00') : null;
  const base = atual && atual.getTime() > Date.now() ? atual : new Date();
  base.setDate(base.getDate() + n);
  $('m-expira').value = toInput(base);
});
$('m-salvar').onclick = async () => {
  try{
    const v = $('m-expira').value;
    const dados = {
      ativo: $('m-ativo').value === 'true',
      expiraEm: v ? Timestamp.fromDate(fimDoDia(new Date(v + 'T12:00:00'))) : null,
      obs: $('m-obs').value.trim(),
      atualizadoEm: new Date().toISOString(),
    };
    await setDoc(doc(db, 'assinaturas', editUid), dados, { merge: true });
    assinaturas[editUid] = { ...(assinaturas[editUid] || {}), ...dados };
    $('modal-bg').classList.remove('open');
    renderTudo();
  }catch(e){ $('m-msg').style.color = 'var(--red)'; $('m-msg').textContent = 'Erro: ' + e.message; }
};

/* ---- Polos ---- */
function renderSelectGestores(){
  $('novo-polo-gestor').innerHTML = usuarios.map(u => `<option value="${u.uid}">${esc(u.email)}</option>`).join('');
}
function emailDe(uid){ const u = usuarios.find(x => x.uid === uid); return u ? u.email : uid; }
function renderPolos(){
  if(!polos.length){ $('lista-polos').innerHTML = '<div class="card hint">Nenhum polo criado ainda.</div>'; return; }
  $('lista-polos').innerHTML = polos.map(p => `<div class="card">
    <div class="row"><div class="grow"><b>${esc(p.nome)}</b></div></div>
    <div style="margin-top:6px;">${(p.gestores || []).map(g => `<span class="tag">${esc(emailDe(g))} <a href="#" data-rm="${p.id}|${g}" style="color:var(--red);text-decoration:none;">✕</a></span>`).join('') || '<span class="hint">Sem gestores</span>'}</div>
    <div class="row" style="margin-top:8px;">
      <div class="grow"><select data-sel="${p.id}">${usuarios.filter(u => !(p.gestores || []).includes(u.uid)).map(u => `<option value="${u.uid}">${esc(u.email)}</option>`).join('')}</select></div>
      <button class="btn sm" data-add-g="${p.id}">+ Vincular gestor</button>
    </div></div>`).join('');
  document.querySelectorAll('[data-rm]').forEach(a => a.onclick = async (ev) => {
    ev.preventDefault();
    const [pid, uid] = a.dataset.rm.split('|');
    if(!confirm('Remover ' + emailDe(uid) + ' deste polo?')) return;
    await updateDoc(doc(db, 'polos', pid), { gestores: arrayRemove(uid) });
    const p = polos.find(x => x.id === pid); p.gestores = p.gestores.filter(g => g !== uid); renderTudo();
  });
  document.querySelectorAll('[data-add-g]').forEach(b => b.onclick = async () => {
    const pid = b.dataset.addG, sel = document.querySelector(`[data-sel="${pid}"]`);
    if(!sel || !sel.value) return;
    await updateDoc(doc(db, 'polos', pid), { gestores: arrayUnion(sel.value) });
    const p = polos.find(x => x.id === pid); p.gestores = [...(p.gestores || []), sel.value]; renderTudo();
  });
}
$('btn-criar-polo').onclick = async () => {
  const nome = $('novo-polo-nome').value.trim(), uid = $('novo-polo-gestor').value;
  if(!nome || !uid){ $('msg-polo').textContent = 'Informe o nome e o gestor.'; return; }
  try{
    const ref = await addDoc(collection(db, 'polos'), { nome, gestores: [uid], criadoEm: new Date().toISOString().slice(0,10) });
    polos.push({ id: ref.id, nome, gestores: [uid] });
    $('novo-polo-nome').value = ''; $('msg-polo').style.color = 'var(--green)'; $('msg-polo').textContent = 'Polo criado!';
    renderTudo();
  }catch(e){ $('msg-polo').style.color = 'var(--red)'; $('msg-polo').textContent = 'Erro: ' + e.message; }
};

/* ---- Config ---- */
$('btn-salvar-cfg').onclick = async () => {
  try{
    await setDoc(doc(db, 'config', 'geral'), { contatoAdmin: $('cfg-contato').value.replace(/\D/g, ''), mensagemBloqueio: $('cfg-msg').value.trim() }, { merge: true });
    $('msg-cfg').style.color = 'var(--green)'; $('msg-cfg').textContent = 'Salvo!';
  }catch(e){ $('msg-cfg').style.color = 'var(--red)'; $('msg-cfg').textContent = 'Erro: ' + e.message; }
};

/* ---- Abas ---- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  ['gestores','polos','config'].forEach(t => $('tab-' + t).style.display = t === b.dataset.tab ? 'block' : 'none');
});
</script>
</body>
</html>
